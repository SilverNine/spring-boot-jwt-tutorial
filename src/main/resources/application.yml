spring:

  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true

jwt:
  # HS512 서명이라 64바이트(512비트) 이상의 키가 필요합니다. 값은 Base64로 인코딩한 문자열입니다.
  # 아래 기본값은 로컬 실습용입니다. 운영에서는 반드시 JWT_SECRET 환경변수로 주입하세요.
  # 만드는 법: openssl rand -base64 64
  secret: ${JWT_SECRET:c2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQtc2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQ=}
  # Access Token은 짧게, Refresh Token은 길게 둡니다. 30m, 1h, 14d 같은 형식을 씁니다.
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:14d}

logging:
  level:
    me.silvernine: DEBUG